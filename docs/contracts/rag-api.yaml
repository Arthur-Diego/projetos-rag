openapi: 3.1.0

info:
  title: Contrato RAG compartilhado
  version: 1.3.0
  description: |
    Contrato HTTP comum aos projetos da trilha. Um frontend que fale este contrato
    conversa com qualquer projeto sem conhecer nenhum deles.

    **O mecanismo de desacoplamento é `GET /capabilities`.** O backend descreve os
    parâmetros que aceita, em JSON Schema, e o frontend renderiza os controles a partir
    dessa descrição. Nenhum projeto novo exige alteração no frontend: ele acrescenta uma
    entrada em `parameters` e o controle aparece sozinho.

    Regra de evolução: **acrescente campos opcionais, nunca altere os obrigatórios.**
    Um projeto que precise mudar `POST /ask` está pedindo uma versão nova do contrato,
    não uma customização.

    ## 1.3.0 — fontes multimodais

    Campos opcionais novos, **nenhum obrigatório alterado e nenhum relaxamento**.
    Origem: `rag-04-multimodal-docs/docs/adrs/generated/RAG/ADR-004`.

    O que motiva: um projeto passou a indexar tabelas e imagens de PDFs, não só
    trechos de texto. Uma resposta pode se apoiar numa tabela, e 1.2.0 não tinha
    como dizer isso ao consumidor: todo hit era, implicitamente, um trecho de texto.

    - **`hits[].kind`**, opcional, `texto | tabela | imagem`. Que tipo de fonte
      sustenta a resposta. Ausente nos projetos que só indexam texto, e o consumidor
      trata a ausência como o comportamento de sempre.
    - **`hits[].content_html`**, opcional. O HTML da tabela ORIGINAL, para o cliente
      renderizar linhas e colunas de verdade. Presente **apenas** quando
      `kind=tabela`.
    - **`IngestionReport.elements`**, opcional. Contagem de `textos`, `tabelas` e
      `imagens` extraídos, tornando o resultado da extração visível ao cliente e não
      só ao log do servidor.
    - **`GET /health` ganha o campo `docstore_originals`.** Um projeto pode manter um
      segundo armazém com os originais, ligado ao índice por identificador. Índice e
      docstore dessincronizados são `degraded`, e continua sendo 200.

    **`excerpt` não muda de tipo nem de sentido, e HTML nunca entra nele.** O que
    muda é o que ele carrega conforme o `kind`: com `kind=tabela`, o resumo em
    linguagem natural (foi ele que casou com a busca); com `kind=imagem`, a descrição
    da imagem; com `kind=texto` ou `kind` ausente, o próprio trecho, como sempre.
    Despejar HTML em `excerpt` quebraria a exibição de todo cliente existente — o
    oposto de aditivo, e o motivo de `content_html` ser campo separado.

    Fora do escopo desta versão, declarado: **servir o arquivo da imagem.** Não há
    rota de mídia. A imagem participa como descrição textual em `excerpt`.

    ## 1.2.0 — busca híbrida e custo por estágio

    Campos opcionais novos, e **um relaxamento declarado**. Origem:
    `rag-03-hybrid-rerank/docs/adrs/generated/RAG/ADR-005`.

    O que motiva: um projeto passou a recuperar por dois caminhos independentes
    (semântico e léxico), fundi-los e reordenar o resultado. Isso quebra duas
    suposições que 1.0.0 e 1.1.0 podiam fazer.

    - **`hits[].score`**, opcional. Pontuação final de ordenação, onde MAIOR é melhor.
      Convive com `distance`, que continua sendo distância e onde MENOR é melhor. Os
      dois campos existem separados porque têm sentidos OPOSTOS: escrever pontuação no
      campo de distância inverteria a leitura de quem exibe "o mais próximo" usando o
      mínimo, sem erro nenhum.
    - **`hits[].provenance`**, opcional. De qual caminho o trecho veio, em que posição
      ficou em cada um, e o que a fusão e a reordenação fizeram com ele. É o que torna a
      ordem final explicável em vez de mágica.
    - **`timings.dense_s`, `keyword_s`, `fusion_s` e `rerank_s`**, opcionais. Decompõem
      `search_s`, que MANTÉM o significado de total do estágio de recuperação. Quem
      somar os cinco conta a recuperação duas vezes.
    - **`GET /health` ganha o campo `text_field_analyzed`.** Um índice pode estar no ar,
      populado, e ainda assim inutilizável para busca léxica. O `status` passa a ser
      `degraded` também nesse caso, e **continua sendo 200**: saúde reporta estado, não
      falha por causa dele. Quem falha com 409 é `POST /ask`, que é onde o índice
      inutilizável impede o trabalho.

    **O relaxamento, declarado porque não é aditivo:** `distance` sai de `required` em
    `SearchHit`. Um trecho encontrado APENAS por busca léxica não tem distância nenhuma;
    BM25 não mede distância. Manter o campo obrigatório exigiria inventar um valor, e um
    número inventado num campo que a interface usa para ordenar é pior que a ausência.

    O campo continua sendo emitido sempre que existe: todo trecho que passou pelo
    caminho semântico o carrega, em qualquer configuração. Projetos que só fazem busca
    densa (`rag-01`, `rag-02`) o emitem em 100 por cento dos hits e não mudam uma linha.
    Consumidores devem tratá-lo como opcional a partir desta versão.

    ## 1.1.0 — conversa e procedência

    Três campos opcionais, nenhum obrigatório alterado. O `rag-01-fundamentos-pdf`
    continua conforme sem tocar em uma linha: ele simplesmente não os emite.

    - `options.history` em `POST /ask`: a transcrição dos turnos anteriores. O backend
      não guarda conversa; **o cliente é dono dela** e a devolve a cada chamada. É o que
      a feature `history` significa.
    - `citations` no `Answer`: liga cada rótulo `[n]` do texto ao trecho que o sustenta.
      A ligação é explícita, **nunca posicional sobre `hits`** — dedup ou reordenação de
      `hits` faria `[3]` apontar para o trecho errado sem erro nenhum, que é uma citação
      que parece verificada e não está.
    - `rewritten_question` no `Answer`: a pergunta efetivamente buscada, depois de
      resolvida contra o histórico, e a decisão que a produziu.

    **Opcional aqui não significa opcional lá.** Os três campos ficam fora de
    `required` porque torná-los obrigatórios quebraria o `rag-01`, que não os emite.
    Um projeto pode garantir mais do que este contrato exige: o
    `rag-02-conversacional-citacoes` promete `rewritten_question` e
    `timings.rewrite_s` em 100 por cento das respostas de `/ask`. Um cliente genérico
    deve tratá-los como opcionais; um cliente que fale com um backend específico pode
    contar com o que aquele backend prometeu.

    Origem: `rag-02-conversacional-citacoes/docs/adrs/generated/RAG/ADR-005`.

servers:
  - url: http://localhost:8080
    description: Padrão local. Cada projeto pode usar outra porta.

paths:
  /health:
    get:
      summary: O serviço está de pé e o índice tem conteúdo
      description: |
        Barato e sem efeito colateral. O frontend chama antes de habilitar a interface,
        para distinguir "backend fora do ar" de "pergunta sem resposta".
      responses:
        "200":
          description: Operante
          content:
            application/json:
              schema:
                type: object
                required: [status, project]
                properties:
                  status: { type: string, enum: [ok, degraded] }
                  project: { type: string, example: rag-01-fundamentos-pdf }
                  collection: { type: string, example: livros }
                  indexed_chunks: { type: integer, example: 617 }
                  embedding_model: { type: string, example: text-embedding-3-small }
                  embedding_dimensions: { type: integer, example: 1536 }
                  text_field_analyzed:
                    type: boolean
                    description: |
                      Opcional, desde 1.2.0. O campo de texto do índice está preparado
                      para busca por termos. `false` significa que a busca léxica não
                      encontra nada, **sem erro nenhum**: o índice responde, está
                      populado, e metade de um funil híbrido está morta. Ausente em
                      projetos que não fazem busca léxica.
                  docstore_originals:
                    type: integer
                    # Igual ao example de `indexed_chunks` DE PROPÓSITO: os
                    # exemplos por campo compõem uma resposta, e como a própria
                    # descrição abaixo manda comparar os dois, exemplos
                    # divergentes descreveriam um sistema degradado com
                    # `status: ok` implícito.
                    example: 617
                    description: |
                      Opcional, desde 1.3.0. Quantos originais o segundo armazém
                      guarda, em projetos que separam o que é indexado do que é
                      devolvido ao modelo (indexa-se um resumo, devolve-se o
                      original, ligados por identificador).

                      **É informativo e vale contra `indexed_chunks`:** os dois
                      divergirem denuncia identificador órfão — trecho no índice cujo
                      original sumiu, que vira resposta vazia sem erro nenhum. Nesse
                      caso o `status` é `degraded`, e **continua sendo 200**. Ausente
                      em projetos com um armazém só.
        "503":
          description: Dependência externa fora do ar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }

  /capabilities:
    get:
      summary: O que este backend sabe fazer e quais parâmetros aceita
      description: |
        **O ponto central do contrato.** É o que permite ao frontend ser genérico.

        `parameters` é um JSON Schema reduzido: cada chave é um parâmetro que pode ser
        enviado em `options`, com tipo, default, limites e rótulo legível. O frontend
        monta um formulário a partir daí e não precisa saber o que cada campo significa.
      responses:
        "200":
          description: Descritor do backend
          content:
            application/json:
              schema:
                type: object
                required: [project, features, parameters]
                properties:
                  project: { type: string }
                  description: { type: string }
                  features:
                    type: array
                    description: Operações suportadas. O frontend esconde o que não existir.
                    items: { type: string, enum: [ask, ingest, stream, sources, history] }
                  parameters:
                    type: object
                    description: Parâmetros extras aceitos em `options`, por nome.
                    additionalProperties: { $ref: "#/components/schemas/ParameterSpec" }
              example:
                project: rag-01-fundamentos-pdf
                description: RAG ingênuo sobre PDF, com procedência e recusa verificável
                features: [ask, ingest]
                parameters:
                  k:
                    type: integer
                    label: Chunks recuperados
                    help: Quantos trechos enviar ao modelo. Baixo demais falta contexto; alto demais dilui.
                    default: 4
                    minimum: 1
                    maximum: 20
                  chunk_size:
                    type: integer
                    label: Tamanho do chunk
                    help: Caracteres por pedaço. Afeta a indexação, exige reindexar.
                    default: 1000
                    minimum: 100
                    maximum: 8000
                    applies_to: [ingest]

  /ask:
    post:
      summary: Pergunta ao corpus indexado
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question: { type: string, minLength: 1 }
                options:
                  type: object
                  description: |
                    Parâmetros específicos do projeto, conforme `/capabilities`.
                    O backend **ignora chaves desconhecidas** em vez de falhar: é isso que
                    permite ao mesmo frontend falar com projetos de gerações diferentes.
                  additionalProperties: true
                  properties:
                    history:
                      type: array
                      description: |
                        Turnos anteriores da conversa, do mais antigo para o mais recente.
                        Só faz sentido se `history` estiver em `features`.

                        Fica dentro de `options`, e não no primeiro nível do corpo, por
                        compatibilidade: o backend ignora chaves desconhecidas, então um
                        projeto sem conversa recebe e descarta sem falhar. A inelegância é
                        conhecida — `options` foi pensado para os escalares de
                        `ParameterSpec`, e uma lista de turnos não é descritível ali.

                        **Quem trunca é o servidor.** O cliente manda o que tem; o backend
                        aplica a janela de histórico que declarar em `/capabilities`.
                      items: { $ref: "#/components/schemas/Turn" }
            example:
              question: E se eu vender dez?
              options:
                k: 4
                history:
                  - question: Quantos dias de férias eu tenho?
                    answer: 30 dias corridos [1].
      responses:
        "200":
          description: Resposta, com a evidência que a torna verificável
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Answer" }
        "409":
          description: Índice vazio; rode a ingestão
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          description: |
            Parâmetro fora do domínio válido, ou turno malformado em `options.history`.

            Turno sem `question` ou sem `answer` é erro, **nunca descarte silencioso**:
            histórico corrompido produz reescrita errada sem nenhum sintoma.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }
        "500":
          description: Configuração ausente ou inconsistente no backend
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }
        "503":
          description: Dependência externa fora do ar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }

  /ingest:
    post:
      summary: Indexa o corpus, recriando a coleção
      description: |
        Operação cara e destrutiva: apaga o índice anterior. O frontend deve confirmar
        antes de chamar. Só ofereça se `ingest` estiver em `features`.

        **Nota aditiva, desde 1.3.0.** A destrutividade acima continua valendo e é o
        padrão. Um projeto cuja ingestão seja **idempotente** RECONCILIA em vez de
        recriar: reprocessa o que mudou, preserva o que não mudou e não apaga o
        índice ao reingerir. O contrato não distingue os dois no esquema — a resposta
        é o mesmo `IngestionReport` —, então quem oferece confirmação destrutiva na
        interface deve saber com que backend está falando. Motivo: o custo de
        reingerir é alto quando a extração é pesada (partição de PDF em `hi_res` leva
        minutos), e recriar do zero repagaria o que não mudou.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                options:
                  type: object
                  additionalProperties: true
            example:
              options: { chunk_size: 1000, chunk_overlap: 150 }
      responses:
        "200":
          description: Relatório da indexação
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestionReport" }
        "422":
          description: |
            Parâmetro inválido em `options`. Duas famílias, ambas 422: valor fora da
            faixa (overlap maior que size) e **valor do tipo errado** (um parâmetro
            declarado boolean em `/capabilities` recebendo string ou número). Tipo
            errado é 422, não 500: o pedido é que está malformado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples:
                faixa:
                  summary: Valor fora da faixa
                  value:
                    title: Parâmetro inválido
                    detail: "chunk_overlap (1200) não pode ser maior que chunk_size (1000)."
                    code: INVALID_PARAMETER
                tipo:
                  summary: Tipo errado
                  value:
                    title: Parâmetro inválido
                    detail: "descrever_imagens deve ser booleano (true ou false); recebido: \"sim\"."
                    code: INVALID_PARAMETER
        "500":
          description: Configuração ausente ou inconsistente no backend
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }
        "503":
          description: |
            Dependência externa fora do ar. A ingestão escreve no armazém vetorial,
            então ela falha pelos mesmos motivos que `/ask`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }

components:
  schemas:
    ParameterSpec:
      type: object
      required: [type, label]
      properties:
        type: { type: string, enum: [integer, number, string, boolean, enum] }
        label: { type: string, description: Rótulo legível, já traduzido }
        help: { type: string, description: Explicação curta, exibida como dica }
        default: {}
        minimum: { type: number }
        maximum: { type: number }
        values:
          type: array
          description: Valores permitidos quando type é enum
          items: { type: string }
        applies_to:
          type: array
          description: Operações em que este parâmetro vale. Ausente significa todas.
          items: { type: string, enum: [ask, ingest] }

    SearchHit:
      type: object
      required: [source]
      description: |
        Um trecho recuperado.

        **Duas escalas OPOSTAS convivem aqui, e confundi-las é defeito silencioso.**

        `distance` é DISTÂNCIA: menor é mais próximo. `score` é PONTUAÇÃO: maior é
        melhor. Escrever pontuação no campo de distância inverteria a leitura de
        qualquer cliente que exiba "o mais próximo" usando o mínimo. Por isso são
        campos separados, e nunca o mesmo.

        `distance` saiu de `required` em 1.2.0: um trecho encontrado apenas por busca
        léxica não tem distância, porque BM25 não mede distância nenhuma. Ele continua
        presente sempre que o trecho passou pelo caminho semântico.
      properties:
        source: { type: string, example: harry-potter.pdf }
        page: { type: integer, description: Numerada a partir de 1, para humanos }
        distance:
          type: number
          format: float
          example: 0.875
          description: |
            Distância no espaço vetorial: MENOR é mais próximo. Ausente quando o trecho
            veio apenas da busca léxica.
        score:
          type: number
          format: float
          example: 8.42
          description: |
            Opcional, desde 1.2.0. Pontuação final de ordenação: MAIOR é melhor. Carrega
            o valor da reordenação quando ela rodou, e o da fusão quando não rodou. Não é
            comparável entre configurações diferentes, e não deve ser exibido como
            percentual de nada.
        provenance:
          allOf: [{ $ref: "#/components/schemas/Provenance" }]
          description: Opcional, desde 1.2.0.
        kind:
          type: string
          enum: [texto, tabela, imagem]
          example: tabela
          description: |
            Opcional, desde 1.3.0. Que tipo de fonte é este trecho. Ausente em
            projetos que só indexam texto: o consumidor trata a ausência como
            `texto` para exibição, sem exibir selo nenhum.

            **O `kind` determina o que `excerpt` carrega**, sem mudar o tipo dele:
            `tabela` → o resumo em linguagem natural da tabela (foi ele que casou com
            a busca; é curto e exibível); `imagem` → a descrição da imagem; `texto` →
            o próprio trecho. HTML **nunca** entra em `excerpt`, em nenhum caso; ele
            mora em `content_html`.
        content_html:
          type: string
          example: "<table><tr><th>Indicador</th><th>3T24</th></tr><tr><td>Receita de vendas</td><td>129,6</td></tr></table>"
          description: |
            Opcional, desde 1.3.0. O HTML da tabela ORIGINAL, para o cliente
            renderizar linhas e colunas de verdade em vez do resumo.

            **Presente apenas quando `kind=tabela`.** Ausente com `kind=texto`,
            com `kind=imagem` e quando `kind` não é emitido. É HTML de documento,
            de origem externa: o cliente sanitiza antes de pôr no DOM.

            Quem recebe `kind=tabela` sem `content_html` exibe o `excerpt` como
            texto — a inconsistência é do emissor, e degradar é melhor que esconder
            o hit.
        excerpt:
          type: string
          description: |
            Trecho para exibição. Sempre texto, nunca HTML. Desde 1.3.0 o conteúdo
            depende de `kind`: o próprio trecho (`texto` ou `kind` ausente), o resumo
            da tabela (`tabela`) ou a descrição da imagem (`imagem`).

    Provenance:
      type: object
      required: [paths]
      description: |
        Opcional, desde 1.2.0. Por onde o trecho passou e o que cada estágio fez com ele.

        **Campo de caminho que não executou fica AUSENTE, nunca zero.** Zero em
        `keyword_rank` significaria "a busca léxica achou e pôs em primeiro"; ausente
        significa "ela não rodou, ou não achou este trecho". São afirmações diferentes.
      properties:
        paths:
          type: array
          description: Caminhos que encontraram este trecho.
          items: { type: string, enum: [densa, bm25] }
        dense_rank:
          type: integer
          description: Posição no ranking semântico, 1-based. Ausente se não veio de lá.
        keyword_rank:
          type: integer
          description: Posição no ranking léxico, 1-based. Ausente se não veio de lá.
        rrf_score:
          type: number
          format: float
          description: Valor da fusão por posição. Adimensional; maior é melhor.
        rerank_score:
          type: number
          format: float
          description: Pontuação da reordenação. Ausente quando o estágio não rodou.

    Turn:
      type: object
      required: [question, answer]
      description: Um par pergunta e resposta já ocorrido na conversa.
      properties:
        question: { type: string }
        answer:
          type: string
          description: |
            O texto que o backend devolveu, como devolveu. Se ele continha `[n]`, mantenha:
            o estágio de reescrita lê a conversa e os rótulos ajudam a resolver referências.

    Citation:
      type: object
      required: [label, source]
      description: |
        A ligação entre um rótulo `[n]` presente em `text` e o trecho que o sustenta.

        **Não use a posição em `hits` para resolver `[n]`.** `hits` responde "o retriever
        trouxe o quê"; `citations` responde "esta frase veio de onde". São perguntas
        diferentes, e amarrar uma à ordem da outra quebra em silêncio.
      properties:
        label:
          type: integer
          description: O número que aparece como `[n]` no texto. Começa em 1.
        source: { type: string, example: clt.pdf }
        page: { type: integer, description: Numerada a partir de 1, para humanos }
        excerpt: { type: string, description: Trecho que sustenta a afirmação, para exibição }

    RewrittenQuestion:
      type: object
      required: [used]
      description: |
        A pergunta que foi de fato buscada, depois de resolvida contra o histórico.
        Existe para ser exibida, não só registrada: ver a pergunta ambígua virar uma
        pergunta autossuficiente é o que torna o mecanismo observável.
      properties:
        used:
          type: string
          description: A query enviada ao retriever. Igual a `question` quando não houve reescrita.
        original: { type: string }
        rewritten:
          type: boolean
          description: Se houve chamada de LLM para reescrever.
        reason:
          type: string
          description: |
            Por que reescreveu ou não. **Conjunto fechado**, e é isso que o torna
            agregável: sobre string livre não se mede quantas chamadas de LLM a
            reescrita condicional evitou.

            | Valor | Quando | Houve chamada |
            | --- | --- | --- |
            | `primeiro_turno` | conversa vazia | não |
            | `historico_presente` | há histórico e a reescrita condicional está desligada | sim |
            | `pergunta_curta` | condicional ligada, pergunta abaixo do limiar de palavras | sim |
            | `marcador_anaforico` | condicional ligada, pergunta com pronome ou locução de referência | sim |
            | `pergunta_autossuficiente` | condicional ligada, nenhum gatilho disparou | não |
            | `reescrita_falhou` | a chamada falhou; caiu para a pergunta original | tentou |

            Um backend que precise de um motivo novo pede uma versão do contrato,
            não um valor fora da lista.
          enum:
            - primeiro_turno
            - historico_presente
            - pergunta_curta
            - marcador_anaforico
            - pergunta_autossuficiente
            - reescrita_falhou

    Answer:
      type: object
      required: [text, hits, refused, timings]
      properties:
        text: { type: string }
        refused:
          type: boolean
          description: |
            **Campo essencial.** O backend compara a resposta com sua frase de escape e
            informa se recusou. Sem isso, o frontend teria que comparar strings, o que o
            acoplaria ao texto exato de cada projeto.
        hits:
          type: array
          items: { $ref: "#/components/schemas/SearchHit" }
        citations:
          type: array
          description: |
            Opcional, desde 1.1.0. Presente quando o projeto emite citação por afirmação.
            **Uma resposta com `refused: true` tem `citations` vazia** — recusa com citação
            é defeito.
          items: { $ref: "#/components/schemas/Citation" }
        rewritten_question:
          allOf: [{ $ref: "#/components/schemas/RewrittenQuestion" }]
          description: Opcional, desde 1.1.0. Presente quando `history` está em `features`.
        timings:
          type: object
          description: Latência por estágio, em segundos. Permite atribuir lentidão ao estágio certo.
          properties:
            rewrite_s:
              type: number
              format: float
              description: |
                Opcional, desde 1.1.0. O estágio de reescrita é uma chamada de LLM a mais
                por turno; sem medi-lo em separado, o custo novo não é atribuível.
            search_s:
              type: number
              format: float
              description: |
                TOTAL do estágio de recuperação. Os quatro campos abaixo o DECOMPÕEM, e
                por isso quem somar os cinco conta a recuperação duas vezes.
            dense_s:
              type: number
              format: float
              description: |
                Opcional, desde 1.2.0. Busca semântica. Inclui a chamada de embedding da
                pergunta, que costuma dominar o custo do estágio.
            keyword_s:
              type: number
              format: float
              description: |
                Opcional, desde 1.2.0. Busca léxica. **Ausente quando o caminho não
                rodou**, nunca zero: zero significaria "rodou e foi instantâneo".
            fusion_s:
              type: number
              format: float
              description: Opcional, desde 1.2.0. Fusão dos rankings.
            rerank_s:
              type: number
              format: float
              description: |
                Opcional, desde 1.2.0. Reordenação. **Ausente quando o estágio não
                rodou.** Em processador comum costuma dominar o turno inteiro.
            generation_s: { type: number, format: float }
        meta:
          type: object
          description: |
            Extras do projeto (rota escolhida, ciclos do grafo, saltos). Opcional.

            Exemplo em uso: o `rag-02` publica aqui `unresolved_labels`, os rótulos
            `[n]` que o modelo citou e que não existem entre os trechos enviados. É
            anomalia diagnosticável de um projeto, não parte do contrato comum, e por
            isso mora em `meta` e não em `citations`.
          additionalProperties: true

    IngestionReport:
      type: object
      required: [pages, chunks, seconds]
      properties:
        pages: { type: integer, example: 274 }
        chunks: { type: integer, example: 617 }
        discarded_pages: { type: integer }
        previous_chunks: { type: integer, description: Quantos foram descartados da coleção anterior }
        chunk_size: { type: integer }
        chunk_overlap: { type: integer }
        seconds: { type: number, format: float }
        elements:
          type: object
          description: |
            Opcional, desde 1.3.0. Quantos elementos de cada tipo a extração
            encontrou. Ausente em projetos que não separam a fonte por tipo.

            **Quando o objeto está presente, as três contagens estão presentes, e
            categoria que não ocorreu vale ZERO explícito, nunca ausente.** Ausência
            significaria "não sei", e "não sei" e "procurei e não achei" são
            afirmações diferentes para quem lê o relatório de uma extração
            multimodal: zero tabelas num relatório financeiro é o sinal de que o
            estágio de detecção não rodou.
          required: [textos, tabelas, imagens]
          properties:
            textos: { type: integer, example: 41 }
            tabelas: { type: integer, example: 12 }
            imagens: { type: integer, example: 5 }

    Problem:
      type: object
      description: Erro legível, no espírito do RFC 7807. A mensagem diz o que fazer.
      required: [title, detail]
      properties:
        title: { type: string, example: Serviço indisponível }
        detail:
          type: string
          example: "Chroma não respondeu em http://localhost:8000. Suba com: docker compose up -d chroma"
        code: { type: string, example: SERVICE_UNAVAILABLE }
